server:
  port: 3001
  address: 0.0.0.0

spring:
  application:
    name: rowboat-agents
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/rowboat}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 1
  ai:
    openai:
      api-key: sk-9930385949b643e19194481410d2eeef
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-max-latest
      client:
        connection-timeout: 60000
        read-timeout: 300000
        write-timeout: 60000

logging:
  level:
    com.rowboat.agents: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# API Configuration
api:
  key: ${API_KEY:}

# OpenAI Configuration
openai:
  api:
    key: ${OPENAI_API_KEY:}
    timeout: 60s

# Application Configuration
app:
  enable-tracing: ${ENABLE_TRACING:false}
  start-turn-with-start-agent: ${START_TURN_WITH_START_AGENT:false}

qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6333}
  api-key: ${QDRANT_API_KEY:}
  collection-name: ${QDRANT_COLLECTION_NAME:rowboat_agents_embeddings}

agent:
  max-calls-per-turn: ${AGENT_MAX_CALLS_PER_TURN:10}
  max-tokens-per-turn: ${AGENT_MAX_TOKENS_PER_TURN:4000}
  max-tokens-per-response: ${AGENT_MAX_TOKENS_PER_RESPONSE:2000}
  temperature: ${AGENT_TEMPERATURE:0.7}
  rag-enabled: ${AGENT_RAG_ENABLED:true}
  rag-top-k: ${AGENT_RAG_TOP_K:5}
  rag-similarity-threshold: ${AGENT_RAG_SIMILARITY_THRESHOLD:0.7} 